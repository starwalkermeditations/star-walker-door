<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Walker Meditations | A Living Sanctuary for the Soul</title>
  <meta name="description" content="Star Walker Meditations is a living sanctuary for the soul, created for remembrance, consciousness, self-discovery, and the exploration of who we truly are.">
  <link rel="canonical" href="https://starwalkermeditations.com/">
  <meta name="robots" content="index,follow">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #001d2c;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    .door {
      position: relative;
      width: min(100vw, 100vh);
      aspect-ratio: 1 / 1;
    }
    .door img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .begin-link {
      position: absolute;
      left: 34.5%;
      top: 85.8%;
      width: 30.8%;
      height: 8.2%;
      z-index: 2;
      border-radius: 18px;
    }
    .begin-link:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="door">
    <img src="star-walker-door.png"
         alt="Star Walker — It's Time to Know You">
    <a class="begin-link"
       href="https://payhip.com/StarWalkerMeditations"
       aria-label="Begin Star Walker"></a>
  </main>
</body>
</html>
